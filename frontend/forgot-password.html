<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSetu | Forgot Password</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/careersetu-logo.png" alt="CareerSetu Logo">
        <span class="brand-title">CareerSetu</span>
      </a>

      <div class="nav-user">
        <a href="login.html" class="btn btn-outline" style="padding: 7px 16px; font-size: 0.88rem;">Back to Login</a>
      </div>
    </div>
  </nav>

  <!-- Forgot Password Card Section -->
  <main class="container" style="padding: 40px 20px 60px; display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 480px; box-shadow: var(--shadow-hover);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 2.4rem; margin-bottom: 8px;">🔑</div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Forgot Password?</h1>
        <p style="font-size: 0.93rem; color: var(--text-muted); line-height: 1.5;">
          Enter your registered email address and we'll send you a secure link to reset your password.
        </p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">✉</span>
            <input type="email" id="forgotEmail" class="form-control" placeholder="Enter your registered email" required autofocus>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
          Send Reset Link ➔
        </button>
      </form>

      <div class="auth-switch-text" style="margin-top: 24px; text-align: center;">
        Remembered your password? <a href="login.html">Back to Login</a>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    Empowering Underprivileged Students | Better Education ◆ Brighter Future
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
