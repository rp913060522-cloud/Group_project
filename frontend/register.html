<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Career Guidance Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo/logo.svg" alt="Career Guidance Portal Logo">
        <span class="brand-title">Career Guidance Portal</span>
      </a>

      <div class="nav-user">
        <a href="login.html" class="btn btn-outline" style="padding: 7px 16px; font-size: 0.88rem;">Already registered? Login</a>
      </div>
    </div>
  </nav>

  <!-- Registration Card Section -->
  <main class="container" style="padding: 40px 20px 60px; display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 480px; box-shadow: var(--shadow-hover);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Create Account</h1>
        <p style="font-size: 0.95rem; color: var(--text-muted);">Sign up for free career guidance and scholarship roadmaps</p>
      </div>

      <form id="regForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">✉</span>
            <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
          Register &amp; Continue ➔
        </button>
      </form>

      <div class="auth-switch-text">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    Empowering Underprivileged Students | Better Education ◆ Brighter Future
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
