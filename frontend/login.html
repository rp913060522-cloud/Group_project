<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSetu | Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Split Screen Layout matching Stitch Login Page -->
  <div class="login-page-wrapper">
    
    <!-- Left Hero Column -->
    <div class="login-left-column">
      <div class="login-left-header">
        <img src="assets/careersetu-logo.png" alt="CareerSetu Logo">
        <h3>CareerSetu</h3>
        <p>Your Future, Our Guidance</p>
      </div>

      <div class="login-left-hero">
        <h2>Explore Your Potential<br>Build Your Future</h2>
        
        <!-- Illustration matching Stitch -->
        <div class="login-illustration-container">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="auto">
            <!-- Sky & Hills -->
            <ellipse cx="200" cy="280" rx="190" ry="80" fill="#bfdbfe" opacity="0.3"/>
            <circle cx="200" cy="190" r="70" fill="#fef08a" opacity="0.5"/>
            <!-- Road -->
            <path d="M170 320 Q 185 240 205 190 Q 215 240 230 320 Z" fill="#ffffff"/>
            <!-- Signpost -->
            <g transform="translate(225, 120)">
              <rect x="25" y="0" width="8" height="180" fill="#475569" rx="2"/>
              <!-- Sign 1: Career -->
              <path d="M0 5 L65 5 L75 19 L65 33 L0 33 Z" fill="#2563eb"/>
              <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Career</text>
              <!-- Sign 2: Education -->
              <path d="M0 45 L75 45 L85 59 L75 73 L0 73 Z" fill="#10b981"/>
              <text x="8" y="64" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Education</text>
              <!-- Sign 3: Scholarship -->
              <path d="M0 85 L85 85 L95 99 L85 113 L0 113 Z" fill="#f59e0b"/>
              <text x="6" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Scholarship</text>
              <!-- Sign 4: Success -->
              <path d="M0 125 L68 125 L78 139 L68 153 L0 153 Z" fill="#8b5cf6"/>
              <text x="10" y="144" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Success</text>
            </g>
            <!-- Student Back View -->
            <g transform="translate(130, 160)">
              <circle cx="45" cy="30" r="16" fill="#1e293b"/>
              <path d="M26 48 C26 48 40 42 62 48 L62 140 L26 140 Z" fill="#1d4ed8"/>
              <!-- Backpack -->
              <rect x="12" y="55" width="28" height="52" rx="12" fill="#2563eb"/>
              <path d="M28 130 L35 140 L40 140 L40 160 L28 160 Z" fill="#0f172a"/>
              <path d="M42 140 L50 130 L60 130 L60 160 L48 160 Z" fill="#0f172a"/>
            </g>
          </svg>
        </div>
      </div>

      <div style="text-align: center; font-size: 0.85rem; color: var(--text-light);">
        Empowering Underprivileged Students
      </div>
    </div>

    <!-- Right Login Form Column -->
    <div class="login-right-column">
      <div class="login-form-box">
        <h1 class="login-form-title">Login</h1>
        <p class="login-form-subtitle">Welcome back! Please login to your account.</p>

        <form id="loginForm">
          <!-- Email / Username -->
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email / Username</label>
            <div class="input-with-icon">
              <span class="input-icon">✉</span>
              <input type="text" id="loginEmail" class="form-control" placeholder="Enter your email or username" required>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="input-with-icon">
              <span class="input-icon">🔒</span>
              <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
              <button type="button" id="togglePassword" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-light);">👁</button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="login-options-row">
            <label class="remember-checkbox">
              <input type="checkbox" checked> Remember me
            </label>
            <a href="#" class="forgot-link" onclick="alert('For viva demo: Use student@demo.org with password123 to log in.'); return false;">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem;">
            Login
          </button>

          <!-- Skip for Now — Continue as Guest -->
          <button type="button" id="skipGuestBtn" class="btn btn-outline btn-block" style="margin-top: 12px; padding: 12px; font-size: 0.95rem; border-color: var(--primary-border); color: var(--primary); font-weight: 600;">
            Skip for Now — Continue as Guest ➔
          </button>
        </form>

        <div class="auth-switch-text">
          Don't have an account? <a href="register.html">Register</a>
        </div>

      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
