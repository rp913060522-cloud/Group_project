<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f0fe"/>
      <stop offset="60%" stop-color="#edf5ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="360" rx="20" fill="url(#skyGrad)"/>
  
  <!-- Clouds & Hills -->
  <ellipse cx="650" cy="170" rx="140" ry="70" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="780" cy="150" rx="160" ry="80" fill="#ffffff" opacity="0.6"/>
  <circle cx="980" cy="240" r="130" fill="#fef08a" opacity="0.35"/>
  <ellipse cx="1060" cy="320" rx="280" ry="120" fill="#bbf7d0" opacity="0.35"/>
  <ellipse cx="880" cy="340" rx="260" ry="110" fill="#93c5fd" opacity="0.25"/>

  <!-- Pathway -->
  <path d="M720 360 Q 770 280 840 240 Q 920 200 980 200 Q 940 200 860 250 Q 800 290 770 360 Z" fill="url(#pathGrad)"/>

  <!-- Left Content -->
  <g transform="translate(90, 85)">
    <text x="0" y="50" font-family="Segoe UI, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f2942">Your Career</text>
    <text x="0" y="105" font-family="Segoe UI, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f2942">Matters</text>
    <text x="0" y="152" font-family="Segoe UI, -apple-system, sans-serif" font-size="19" fill="#475569">Get the right guidance, explore</text>
    <text x="0" y="180" font-family="Segoe UI, -apple-system, sans-serif" font-size="19" fill="#475569">opportunities and build a brighter future.</text>
    
    <!-- Button -->
    <rect x="0" y="210" width="180" height="46" rx="23" fill="#2563eb"/>
    <text x="28" y="240" font-family="Segoe UI, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Explore Now ➔</text>
  </g>

  <!-- Signpost -->
  <g transform="translate(800, 120)">
    <!-- Post Pole -->
    <rect x="42" y="20" width="10" height="200" fill="#475569" rx="3"/>
    
    <!-- Sign 1: Education -->
    <path d="M0 25 L88 25 L102 43 L88 61 L0 61 Z" fill="#2563eb"/>
    <text x="14" y="48" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Education</text>

    <!-- Sign 2: Career -->
    <path d="M8 72 L96 72 L110 90 L96 108 L8 108 Z" fill="#10b981"/>
    <text x="24" y="95" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Career</text>

    <!-- Sign 3: Success -->
    <path d="M6 120 L94 120 L108 138 L94 156 L6 156 Z" fill="#f59e0b"/>
    <text x="18" y="143" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Success</text>
  </g>

  <!-- Student with Backpack Illustration -->
  <g transform="translate(640, 185)">
    <!-- Head -->
    <circle cx="70" cy="50" r="22" fill="#1e293b"/>
    <circle cx="78" cy="52" r="16" fill="#fbcfe8"/>
    <!-- Body Back -->
    <path d="M46 72 C46 72 65 65 88 72 L88 175 L46 175 Z" fill="#1d4ed8"/>
    <!-- Backpack -->
    <rect x="25" y="80" width="38" height="65" rx="14" fill="#2563eb"/>
    <rect x="29" y="90" width="30" height="30" rx="8" fill="#1e40af"/>
    <!-- Pants -->
    <path d="M46 165 L56 175 L62 175 L62 200 L46 200 Z" fill="#0f172a"/>
    <path d="M64 175 L74 165 L88 165 L88 200 L72 200 Z" fill="#0f172a"/>
  </g>
</svg>