<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Career Guidance Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Splash Screen (Matching Stitch: Splash Screen 1 sec) -->
  <main class="splash-wrapper" id="splashScreen">
    
    <!-- Logo -->
    <div class="splash-logo-box">
      <img src="assets/logo/logo.svg" alt="Career Guidance Portal Logo">
    </div>

    <!-- Title & Tagline -->
    <h1 class="splash-title">
      Career Guidance
      <span>Portal</span>
    </h1>
    <p class="splash-tagline">Right Guidance | Better Future</p>

    <!-- Welcome Message -->
    <div class="splash-welcome-box">
      <h2>Welcome!</h2>
      <p>Your future begins here...</p>
    </div>

    <!-- 4 Dots Indicator -->
    <div class="splash-dots">
      <div class="splash-dot active"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>

    <!-- Quick action buttons -->
    <div style="margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
      <a href="login.html" class="btn btn-primary" style="padding: 12px 30px; border-radius: var(--radius-pill); font-size: 1rem;">
        Get Started ➔
      </a>
      <a href="dashboard.html" class="btn btn-outline" style="padding: 12px 24px; border-radius: var(--radius-pill); font-size: 1rem;">
        Explore Dashboard
      </a>
    </div>

    <div style="position: absolute; bottom: 20px; font-size: 0.82rem; color: var(--text-light);">
      College CEP Project • Community Engagement Program
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
