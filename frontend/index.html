<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSetu | Welcome</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Splash Screen (Matching Stitch: Splash Screen 1 sec) -->
  <main class="splash-wrapper" id="splashScreen">
    
    <!-- Logo -->
    <div class="splash-logo-box">
      <img src="assets/careersetu-logo.png" alt="CareerSetu Logo">
    </div>

    <!-- Title & Tagline -->
    <h1 class="splash-title">
      Career<span>Setu</span>
    </h1>
    <p class="splash-tagline">Your Future, Our Guidance</p>

    <!-- Welcome Message -->
    <div class="splash-welcome-box">
      <h2>Welcome!</h2>
      <p>Your future begins here...</p>
    </div>

    <!-- 4 Dots Indicator -->
    <div class="splash-dots">
      <div class="splash-dot active"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>

    <!-- Welcome Action Button -->
    <div style="margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
      <a href="login.html" id="splashNextBtn" class="btn btn-primary" style="padding: 14px 44px; border-radius: var(--radius-pill); font-size: 1.05rem; font-weight: 700; min-width: 170px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25); display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        Next ➔
      </a>
    </div>

    <div style="position: absolute; bottom: 20px; font-size: 0.82rem; color: var(--text-light);">
      College CEP Project • Community Engagement Program
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
