<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSetu | Admin Portal Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

  <div class="admin-login-wrapper">
    <div class="admin-login-box">
      <div class="admin-login-header">
        <a href="../index.html">
          <img src="../assets/careersetu-logo.png" alt="CareerSetu Logo">
        </a>
        <h1>Admin Portal</h1>
        <p>Student Analytics &amp; Management Dashboard</p>
      </div>

      <!-- Notification Banner -->
      <div id="adminLoginAlert" class="admin-login-alert" style="display: none;"></div>

      <form id="adminLoginForm">
        <div class="form-group admin-form-group">
          <label class="form-label admin-form-label" for="adminEmail">
            Administrator Email <span style="color: #dc2626;">*</span>
          </label>
          <div class="admin-input-wrap">
            <input
              type="email"
              id="adminEmail"
              class="form-control admin-form-input"
              placeholder="admin@careersetu.org"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group admin-form-group">
          <label class="form-label admin-form-label" for="adminPassword">
            Admin Password <span style="color: #dc2626;">*</span>
          </label>
          <div class="admin-input-wrap" style="position: relative;">
            <input
              type="password"
              id="adminPassword"
              class="form-control admin-form-input"
              placeholder="Enter your administrative password"
              required
            >
            <button
              type="button"
              id="toggleAdminPassword"
              class="btn-toggle-password"
              aria-label="Toggle password visibility"
            >
              👁
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="adminSubmitBtn"
          class="btn-admin btn-admin-primary btn-admin-submit"
        >
          Authenticate &amp; Enter &rarr;
        </button>
      </form>

      <div class="admin-login-footer">
        <p>
          🔒 <strong>Restricted Access:</strong> Authorized CareerSetu administrators only. Student accounts cannot sign in here.
        </p>
        <a href="../login.html" class="admin-return-link">
          &larr; Return to Student Login
        </a>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
