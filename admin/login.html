<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSetu | Admin Portal Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); min-height: 100vh;">

  <div class="admin-login-wrapper">
    <div class="admin-login-box">
      <div class="admin-login-header">
        <a href="../index.html">
          <img src="../assets/careersetu-logo.png" alt="CareerSetu Logo">
        </a>
        <h1>Admin Portal</h1>
        <p>Student Analytics &amp; Management Dashboard</p>
      </div>

      <!-- Notification Banner -->
      <div id="adminLoginAlert" style="display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; margin-bottom: 20px;"></div>

      <form id="adminLoginForm">
        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label" for="adminEmail" style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--admin-text-main);">
            Administrator Email <span style="color: #dc2626;">*</span>
          </label>
          <div style="position: relative;">
            <input
              type="email"
              id="adminEmail"
              class="form-control"
              placeholder="admin@careersetu.org"
              required
              autofocus
              style="width: 100%; padding: 12px 14px; border: 1px solid var(--admin-border); border-radius: 8px; font-size: 0.95rem; outline: none;"
            >
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 22px;">
          <label class="form-label" for="adminPassword" style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--admin-text-main);">
            Admin Password <span style="color: #dc2626;">*</span>
          </label>
          <div style="position: relative;">
            <input
              type="password"
              id="adminPassword"
              class="form-control"
              placeholder="Enter your administrative password"
              required
              style="width: 100%; padding: 12px 40px 12px 14px; border: 1px solid var(--admin-border); border-radius: 8px; font-size: 0.95rem; outline: none;"
            >
            <button
              type="button"
              id="toggleAdminPassword"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--admin-text-light);"
            >
              👁
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="adminSubmitBtn"
          class="btn-admin btn-admin-primary"
          style="width: 100%; padding: 13px; font-size: 1rem; justify-content: center; border-radius: 8px;"
        >
          Authenticate &amp; Enter &rarr;
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--admin-border); text-align: center;">
        <p style="font-size: 0.78rem; color: var(--admin-text-muted); line-height: 1.4; margin-bottom: 12px;">
          🔒 <strong>Restricted Access:</strong> Authorized CareerSetu administrators only. Student accounts cannot sign in here.
        </p>
        <a href="../login.html" style="font-size: 0.85rem; color: var(--admin-primary); font-weight: 600; text-decoration: none;">
          &larr; Return to Student Login
        </a>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
